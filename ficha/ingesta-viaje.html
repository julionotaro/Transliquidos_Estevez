<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingesta de Viajes — Trans. Líquidos Estévez</title>
<!--
  CAMBIO 1 (async / 504): fire-and-forget. El webhook "Ingesta Viaje" pasa a
  responseMode=onReceived y responde en <2s con un acuse JSON
  { ok:true, recibido:true, mensaje:"..." }. Esta pantalla YA NO espera ni
  parsea el informe del viaje: el resumen (N viajes / avisos / faltantes) se ve
  en la vista de Pendientes, mucho mejor presentado.

  IMPORTANTE: "Recibido" significa RECEPCIÓN, NO que el viaje se procesó. El
  procesamiento sigue en segundo plano (2-3 min) y el resultado se verifica en
  Pendientes. Un 200 acá solo confirma que el servidor recibió los archivos.

  Restricciones de artefacto del estudio: sin localStorage, sin
  navigator.clipboard, sin URL.createObjectURL / a.download.
-->
<style>
  body { background:#0d1117; color:#e6edf3; font-family:Segoe UI,system-ui,sans-serif; margin:0; padding:40px 16px; }
  .wrap { max-width:820px; margin:0 auto; }
  h1 { font-size:1.35rem; margin:0 0 24px; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:10px; padding:24px; }
  label { display:block; margin:16px 0 6px; font-weight:600; font-size:.92rem; }
  input[type=file], select, textarea { width:100%; box-sizing:border-box; background:#0d1117; color:#e6edf3; border:1px solid #30363d; border-radius:6px; padding:8px; font-family:inherit; }
  textarea { min-height:70px; resize:vertical; }
  button { margin-top:20px; background:#1f6feb; color:#fff; border:0; border-radius:6px; padding:10px 22px; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #estado { margin-top:14px; font-size:.9rem; }
  .ok { color:#3fb950; } .err { color:#f85149; } .info { color:#8b949e; }
  .acuse { border-left:3px solid #3fb950; padding:10px 12px; margin-top:16px; font-size:.92rem; background:#12261a; border-radius:0 6px 6px 0; display:none; }
  .acuse a { color:#58a6ff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ingesta de Viajes — Trans. Líquidos Estévez</h1>
  <div class="card">
    <p>Subí el PDF escaneado del viaje completo (hoja principal + albaranes + CMR) o fotos de cada documento.</p>
    <label for="docs">Documentos del viaje *</label>
    <input type="file" id="docs" multiple accept=".pdf,.jpg,.jpeg,.png">
    <label for="empresa">Empresa</label>
    <select id="empresa">
      <option>TLE</option>
      <option>HEC</option>
      <option>No estoy seguro</option>
    </select>
    <label for="notas">Notas</label>
    <textarea id="notas" placeholder="Aclaraciones opcionales para la extracción"></textarea>
    <button id="btn">Procesar viaje</button>
    <div id="estado"></div>
    <div class="acuse" id="acuse"></div>
  </div>
</div>
<script>
const WEBHOOK = 'https://studio-julio.duckdns.org/webhook/ingesta-viaje';
const btn = document.getElementById('btn');
const estado = document.getElementById('estado');
const acuse = document.getElementById('acuse');
const docsInput = document.getElementById('docs');
const notasInput = document.getElementById('notas');

function setEstado(msg, cls) { estado.textContent = msg; estado.className = cls || 'info'; }

btn.addEventListener('click', async () => {
  const files = docsInput.files;
  if (!files.length) { setEstado('Seleccioná al menos un archivo.', 'err'); return; }
  const fd = new FormData();
  for (let i = 0; i < files.length; i++) { fd.append('archivo' + i, files[i], files[i].name); }
  fd.append('Empresa', document.getElementById('empresa').value);
  fd.append('Notas', notasInput.value);

  btn.disabled = true;
  acuse.style.display = 'none';
  setEstado('Enviando los documentos…', 'info');

  try {
    const res = await fetch(WEBHOOK, { method: 'POST', body: fd });

    // Fallo de recepción REAL: no lo enmascaramos como éxito.
    if (!res.ok) {
      throw new Error('el servidor respondió HTTP ' + res.status + '. El viaje NO se registró.');
    }

    // El acuse es un JSON mínimo { ok, recibido, mensaje }. Si por lo que sea no
    // viene JSON, un 200 igual confirma recepción; usamos un mensaje por defecto.
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (data && data.ok === false) {
      throw new Error((data.mensaje || 'el servidor rechazó el viaje') + ' El viaje NO se registró.');
    }

    const mensaje = (data && data.mensaje)
      ? data.mensaje
      : 'Viaje recibido. Procesando; aparecerá en Pendientes en 2-3 minutos.';

    setEstado('Recibido ✓', 'ok');
    acuse.innerHTML = escaparHtml(mensaje) +
      '<br><span class="info">"Recibido" es solo recepción — verificá la lectura en <b>Pendientes</b> cuando termine.</span>';
    acuse.style.display = 'block';

    // Fire-and-forget: limpiar y rehabilitar para la próxima carga.
    docsInput.value = '';
    notasInput.value = '';
  } catch (e) {
    setEstado('Error: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
});

// Sin innerHTML de texto sin escapar: el mensaje viene del servidor.
function escaparHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>
</body>
</html>
